name: HelpDesk Pro CI/CD Pipeline

on:
  push:
    branches: [main, capstone-project]
  pull_request:
    branches: [main, capstone-project]
  workflow_dispatch:

jobs:
  ci-pipeline:
    name: Test, Build & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # 1. AUTOMATED TESTING GATE (PYTEST)
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: capstone-helpdesk/backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: capstone-helpdesk/backend
        run: pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: capstone-helpdesk/backend
        run: pytest -v

      # ==========================================
      # 2. FRONTEND PRODUCTION BUILD
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: capstone-helpdesk/frontend/package.json

      - name: Install Frontend Dependencies & Build Bundle
        working-directory: capstone-helpdesk/frontend
        run: |
          npm ci || npm install
          npm run build

      # ==========================================
      # 3. DOCKER CONTAINER BUILDS
      # ==========================================
      - name: Build Backend Docker Image
        run: |
          docker build -t helpdesk-backend:${{ github.sha }} ./capstone-helpdesk/backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t helpdesk-frontend:${{ github.sha }} ./capstone-helpdesk/frontend

      # ==========================================
      # 4. AQUA TRIVY CONTAINER SECURITY SCAN
      # ==========================================
      - name: Run Aqua Trivy Security Scan — Backend
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed helpdesk-backend:${{ github.sha }}

      - name: Run Aqua Trivy Security Scan — Frontend
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity HIGH,CRITICAL --ignore-unfixed helpdesk-frontend:${{ github.sha }}
