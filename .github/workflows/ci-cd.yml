name: HelpDesk Pro CI/CD Pipeline

on:
  push:
    branches: [main, capstone-project]
  pull_request:
    branches: [main, capstone-project]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ==========================================
  # STAGE 1: AUTOMATED TESTING & BUILD GATES
  # ==========================================
  test:
    name: Run Unit Tests & Build Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: capstone-helpdesk/backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: capstone-helpdesk/backend
        run: pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: capstone-helpdesk/backend
        run: pytest -v

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: capstone-helpdesk/frontend/package.json

      - name: Install Frontend Dependencies & Build Bundle
        working-directory: capstone-helpdesk/frontend
        run: |
          npm ci || npm install
          npm run build

  # ==========================================
  # STAGE 2: DOCKER BUILD, TRIVY SCAN & GHCR PUSH
  # ==========================================
  build-scan-push:
    name: Build, Scan & Push Containers
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Images
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/helpdesk-backend:${{ github.sha }} ./capstone-helpdesk/backend
          docker build -t ghcr.io/${{ github.repository_owner }}/helpdesk-frontend:${{ github.sha }} ./capstone-helpdesk/frontend

      - name: Trivy Security Scan — Backend Container
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/helpdesk-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Trivy Security Scan — Frontend Container
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/helpdesk-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Push Containers to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/helpdesk-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/helpdesk-frontend:${{ github.sha }}
