apiVersion: v1
kind: Service
metadata:
  name: {{ include "helpdesk.fullname" . }}-backend
  labels:
    app: helpdesk-backend
    {{- include "helpdesk.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: helpdesk-backend
