{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "helpdesk.fullname" . }}-backend
  labels:
    release: prometheus
    app: helpdesk-backend
    {{- include "helpdesk.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: helpdesk-backend
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
