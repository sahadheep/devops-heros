frontend:
  image: ghcr.io/sahadheep/helpdesk-frontend
  tag: latest
  replicaCount: 2

backend:
  image: ghcr.io/sahadheep/helpdesk-backend
  tag: latest
  replicaCount: 2

namespace: helpdesk
imagePullSecrets: []

postgres:
  enabled: true
  host: helpdesk-postgres
  database: helpdesk
  username: helpdesk
  password: helpdeskpassword
  storage: 5Gi

ingress:
  enabled: true
  className: nginx
  host: helpdesk.local

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

resources:
  backend:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
