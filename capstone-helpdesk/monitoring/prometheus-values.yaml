# Helm values for kube-prometheus-stack
grafana:
  enabled: true
  adminPassword: "admin"
  service:
    type: ClusterIP
    port: 3000

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    retention: 7d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
