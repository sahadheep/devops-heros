server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip compression for static assets
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Route all non-file frontend requests to index.html for SPA routing
  location / {
    try_files $uri /index.html;
  }

  # Proxy /api requests to FastAPI backend service
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy health & readiness probes
  location /health {
    proxy_pass http://backend:8000/health;
  }

  location /ready {
    proxy_pass http://backend:8000/ready;
  }

  location /metrics {
    proxy_pass http://backend:8000/metrics;
  }
}
